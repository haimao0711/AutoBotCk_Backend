# Redis Configuration for Stock Trading Bot
# Standalone mode (not replica)

# Persistence
appendonly yes
save 60 1
save 300 10
save 900 100

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel warning

# Network
tcp-keepalive 300
timeout 0

# Ensure this Redis instance is NOT a replica
# If you want to force standalone mode, uncomment below:
replicaof no one

# Disable replication by default
# min-replicas-to-write 0
# min-replicas-max-lag 10

