# Redis Configuration for Stock Trading Bot
# Standalone mode (not replica)

# Persistence
appendonly yes
save 60 1
save 300 10
save 900 100

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel warning

# Network
tcp-keepalive 300
timeout 0

# Force standalone mode - prevent replica configuration
replicaof no one

# Disable replication features completely
min-replicas-to-write 0
min-replicas-max-lag 10

# Disable protected mode for Docker network access
protected-mode no

# Bind to all interfaces (for Docker)
bind 0.0.0.0

# Disable Redis Sentinel (if any)
# This ensures Redis runs in standalone mode

