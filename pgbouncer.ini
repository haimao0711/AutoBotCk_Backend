[databases]
stockdb = host=stock-predict-postgres port=5432 dbname=stockdb

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
server_reset_query = DISCARD ALL; SET statement_timeout = '300s';
max_client_conn = 1000
default_pool_size = 200
reserve_pool_size = 50
reserve_pool_timeout = 10
max_db_connections = 300
max_user_connections = 200
ignore_startup_parameters = extra_float_digits
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60
# Tăng timeout settings cho long-running tasks
server_connect_timeout = 30
server_login_retry = 30
server_lifetime = 3600
server_idle_timeout = 600
query_timeout = 300
query_wait_timeout = 300
client_idle_timeout = 0
client_login_timeout = 60
autodb_idle_timeout = 3600
