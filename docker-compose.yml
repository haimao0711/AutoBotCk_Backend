services:
  stock-predict-postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: stockdb
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d stockdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_net

  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    restart: always
    environment:
      DATABASES_HOST: stock-predict-postgres
      DATABASES_PORT: 5432
      DATABASES_USER: myuser
      DATABASES_PASSWORD: mypassword
      DATABASES_DBNAME: stockdb
      POOL_MODE: session
      MAX_CLIENT_CONN: 2000
      DEFAULT_POOL_SIZE: 1000
      SERVER_RESET_QUERY: DISCARD ALL
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
      AUTH_TYPE: any
    ports:
      - "6432:6432"
    depends_on:
      stock-predict-postgres:
        condition: service_healthy
    networks:
      - backend_net

  stock-predict-api:
    build: .
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: stockdb
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: 6432
    depends_on:
      - pgbouncer
    ports:
      - "8000:8000"
    command: >
      bash -c "sleep 30 &&
               gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1 --timeout 120"
    networks:
      - backend_net

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - backend_net

  celery-worker:
    build: .
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: stockdb
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: 6432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - pgbouncer
    command: celery -A config worker -l info -Q trading,trading_high_priority,default
    volumes:
      - .:/app
    networks:
      - backend_net
    deploy:
      replicas: 1

  celery-beat:
    build: .
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: stockdb
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: 6432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - pgbouncer
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    networks:
      - backend_net

  celery-flower:
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    entrypoint: ["python", "-m", "flower", "-A", "config", "--port=5555"]
    ports:
      - "5555:5555"
    networks:
      - backend_net

volumes:
  postgres_data:
  redis_data:

networks:
  backend_net:
    external: true
    name: autobotck_backend