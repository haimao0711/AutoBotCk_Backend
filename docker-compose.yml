version: "3.9"

services:
  stock-predict-postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: stockdb
    volumes:
      - postgres_data:/var/lib/postgresql/data

  stock-predict-api:
    build: .
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: stockdb
      POSTGRES_HOST: stock-predict-postgres
    depends_on:
      stock-predict-postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["bash", "/usr/local/bin/wait-for-postgres.sh", "stock-predict-postgres", "gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3"]

volumes:
  postgres_data:
