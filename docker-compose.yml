version: '3'

services:
  stock-predict-api:
    image: 'stock-predict-api:latest'
    ports:
      - '8000:8000'
    volumes:
      - ./env/.env.production:/app/.env
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
    networks:
      - stock-predict_net

  stock-predict-postgres:
    image: postgres:15
    volumes:
      - ./postgres-15:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=stock_predict_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespass
    ports:
      - '5433:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d stock_predict_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
    networks:
      - stock-predict_net

networks:
  stock-predict_net:
    driver: overlay
