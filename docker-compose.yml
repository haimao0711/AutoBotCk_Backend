version: '3.9'

services:
  stock-predict-api:
    build: .
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: stockdb
      POSTGRES_HOST: 14.225.253.51   # IP server PostgreSQL
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    command: >
      bash -c "gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1"

  memcached:
    image: memcached:alpine
    restart: always
    ports:
      - "11211:11211"

