services:
  stock-predict-postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: stockdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d stockdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_net

  stock-predict-api:
    build: .
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: stockdb
      POSTGRES_HOST: stock-predict-postgres
    depends_on:
      - stock-predict-postgres
    ports:
      - "8000:8000"
    command: >
      bash -c "/usr/local/bin/wait-for-postgres.sh stock-predict-postgres &&
               gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1"
    networks:
      - backend_net

  memcached:
    image: memcached:alpine
    restart: always
    ports:
      - "11211:11211"
    networks:
      - backend_net

volumes:
  postgres_data:

networks:
  backend_net:
    driver: bridge