version: '3.9'

services:
  stock-predict-api:
    build: .
    image: "${DOCKER_IMAGE_NAME}:${DOCKER_IMAGE_TAG}"
    container_name: "${DOCKER_CONTAINER_NAME}"
    ports:
      - "8000:8000"
    environment:
      DJANGO_ENV: production
      SECRET_KEY: '9f3L!v@7gB#1sTzR8wQx2YkP$$uM0eHjA5nV4pZrF'
      DEBUG: 'False'
      ALLOWED_HOSTS: '14.225.253.51'
      DB_NAME: stock_predict_db
      DB_USER: postgres
      DB_PASSWORD: postgrespass
      DB_HOST: stock-predict-postgres
      DB_PORT: 5432
    depends_on:
      - stock-predict-postgres
    restart: always
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    networks:
      - stock-predict_net


  stock-predict-postgres:
    image: postgres:15
    container_name: stock-predict-postgres
    volumes:
      - stock-predict-postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - stock-predict_net

networks:
  stock-predict_net:
    driver: bridge

volumes:
  stock-predict-postgres-data:
